<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logotab.png" />
    <link rel="apple-touch-icon" href="/logotab.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Abstrakti – Creative Studio | Graphic Design, Photography & Video | Turku & Helsinki</title>
    <meta name="description" content="Abstrakti is a creative studio based in Turku, Finland, serving clients across Helsinki and Europe. We specialise in graphic design, brand identity, photography, and video production." />
    <meta name="keywords" content="creative studio Turku, creative studio Helsinki, graphic design Finland, photography Turku, video production Turku, brand identity Helsinki, valokuvaus Turku, videotuotanto Suomi, abstrakti studio" />
    <meta name="author" content="Abstrakti" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://abstrakti.eu/" />
    <meta name="geo.region" content="FI-19" />
    <meta name="geo.placename" content="Turku, Finland" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abstrakti.eu/" />
    <meta property="og:title" content="Abstrakti – Creative Studio | Graphic Design, Photography & Video" />
    <meta property="og:description" content="Creative studio based in Turku, Finland. We help brands grow through graphic design, photography, and video production. Serving clients across Finland and Europe." />
    <meta property="og:image" content="https://abstrakti.eu/logoabstrakti.svg" />
    <meta property="og:locale" content="en_FI" />
    <meta property="og:site_name" content="Abstrakti" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abstrakti – Creative Studio | Graphic Design, Photography & Video" />
    <meta name="twitter:description" content="Creative studio based in Turku, Finland. Graphic design, photography, and video production for brands across Finland and Europe." />
    <meta name="twitter:image" content="https://abstrakti.eu/logoabstrakti.svg" />

    <!-- Structured Data: LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "ProfessionalService"],
      "name": "Abstrakti",
      "description": "Creative studio specialising in graphic design, brand identity, photography, and video production. Based in Turku, serving clients across Finland and Europe.",
      "url": "https://abstrakti.eu",
      "logo": "https://abstrakti.eu/logoabstrakti.svg",
      "image": "https://abstrakti.eu/logoabstrakti.svg",
      "telephone": "+358417259298",
      "email": "agustin.garagorry@abstrakti.eu",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Turku",
        "addressRegion": "Southwest Finland",
        "addressCountry": "FI"
      },
      "areaServed": [
        { "@type": "City", "name": "Turku" },
        { "@type": "City", "name": "Helsinki" },
        { "@type": "Country", "name": "Finland" }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Creative Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Design & Brand Identity" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Photography" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Video Production" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Art Direction & Consulting" } }
        ]
      },
      "sameAs": [
        "https://www.instagram.com/abstrakti_wcts/"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
